# App identity. A branded build (e.g. a team's own distribution) overrides these with -P or its
# own gradle.properties; renaming is a change to these lines only: the generated
# no.agens.testlab.AppIdentity derives the keychain service, data folders, MCP server
# name and the Windows MSI upgrade code from them. Source packages stay no.agens.testlab.
# Kept from the first repo on purpose: the id names the vault's keychain entry, the macOS service label and
# the WebDriverAgent bundle, so changing it would lock existing installs out of their saved keys.
testlab.id=io.github.roberthorgen.testlab
testlab.name=Testlab
testlab.slug=testlab
testlab.vendor=Testlab contributors
# The GitHub repo whose Releases the update check reads (owner/name).
testlab.repo=agensdev/testlab-core
# Overridden by the release workflow from the git tag (vMAJOR.MINOR.PATCH).
testlab.version=0.4.0

org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.code.style=official
